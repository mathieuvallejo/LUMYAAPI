services:
  mariadb:
    image: mariadb:latest
    container_name: lumya_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=lumya_secure_pass
      - MARIADB_DATABASE=lumya
      - MARIADB_USER=lumya_user
      - MARIADB_PASSWORD=lumya_secure_pass
    volumes:
      - lumya_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./init.sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "sh", "-c", "mariadb-admin ping -S /var/run/mysqld/mysqld.sock || exit 1"]
      test: ["CMD", "sh", "-c", "mariadb-admin ping -S /var/run/mysqld/mysqld.sock || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lumya_data: